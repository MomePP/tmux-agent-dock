# ── tmux-agent-dock: manual install (no plugin manager) ──
# Clone the repo somewhere, then source its entry script from your tmux.conf.
# Adjust the path to wherever you cloned it.
#
#   git clone https://github.com/Ymirke/tmux-agent-dock ~/.tmux/plugins/tmux-agent-dock
#
run-shell "~/.tmux/plugins/tmux-agent-dock/tmux-agent-dock.tmux"

# Optional overrides — set these BEFORE the run-shell line above:
#   set -g @agent_dock_popup_key 'C-n' # key that opens the popup (default: C-n)
#   set -g @agent_dock_nav 'on'        # vim-aware C-h/C-j/C-k/C-l navigation
#   set -g @agent_dock_view 'sidebar'  # 'sidebar', 'sidebar-right' or 'palette' (Shift+Tab cycles inside)
#   set -g @agent_dock_input 'keys'    # 'keys' (default), 'numbers', or 'search' (Tab cycles)
#   set -g @agent_dock_tab_status 'on' # show agent indicators in tmux window tabs

# ── Or bind manually, without the entry script ──
# bind -n C-n run-shell -b "~/.tmux/plugins/tmux-agent-dock/bin/tmux-agent-dock-popup '#{window_id}' '#{session_name}'"
# bind -n C-j switch-client -n
# bind -n C-k switch-client -p
