# ── tmux-agent-switcher: manual install (no plugin manager) ──
# Clone the repo somewhere, then source its entry script from your tmux.conf.
# Adjust the path to wherever you cloned it.
#
#   git clone https://github.com/Ymirke/tmux-agent-switcher ~/.tmux/plugins/tmux-agent-switcher
#
run-shell "~/.tmux/plugins/tmux-agent-switcher/tmux-agent-switcher.tmux"

# Optional overrides — set these BEFORE the run-shell line above:
#   set -g @agent_switcher_key 'C-n'       # optional extra key that opens the sidebar
#   set -g @agent_switcher_nav 'on'        # vim-aware C-h/C-j/C-k/C-l navigation
#   set -g @agent_switcher_view 'sidebar'  # 'sidebar', 'sidebar-right' or 'palette' (Shift+Tab cycles inside)
#   set -g @agent_switcher_input 'search'  # 'search' or 'keys' (Tab toggles inside)
#   set -g @agent_switcher_tab_status 'on' # show agent indicators in tmux window tabs

# ── Or bind manually, without the entry script ──
# bind -n C-j run-shell -b "~/.tmux/plugins/tmux-agent-switcher/bin/tmux-agent-switcher-popup '#{window_id}' '#{session_name}'"
# bind -n C-k run-shell -b "~/.tmux/plugins/tmux-agent-switcher/bin/tmux-agent-switcher-popup '#{window_id}' '#{session_name}'"
