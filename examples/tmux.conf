# ── ymir-agent-sidebar: manual install (no plugin manager) ──
# Clone the repo somewhere, then source its entry script from your tmux.conf.
# Adjust the path to wherever you cloned it.
#
#   git clone https://github.com/Ymirke/ymir-agent-sidebar ~/.tmux/plugins/ymir-agent-sidebar
#
run-shell "~/.tmux/plugins/ymir-agent-sidebar/ymir-agent-sidebar.tmux"

# Optional overrides — set these BEFORE the run-shell line above:
#   set -g @agent_sidebar_key 'C-n'   # key that opens the sidebar
#   set -g @agent_sidebar_nav 'on'    # vim-aware C-h/C-j/C-k/C-l navigation

# ── Or bind manually, without the entry script ──
# bind -n C-n run-shell -b "~/.tmux/plugins/ymir-agent-sidebar/bin/ymir-agent-sidebar-popup '#{window_id}' '#{session_name}'"
